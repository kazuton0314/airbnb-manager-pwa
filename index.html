<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#294a73">
  <meta name="description" content="茅ヶ崎民泊の訪問業務を記録するアプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>茅ヶ崎民泊 業務記録</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    body{overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#f4f6f9}
    .install{position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:2;border:0;border-radius:999px;padding:12px 18px;background:#294a73;color:#fff;font-size:14px;font-weight:700;box-shadow:0 4px 16px #152a4450;cursor:pointer}
    .install[hidden]{display:none}
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbxcV8JtntB3LJwChAG2frip8SO23kT9etFMNbTq-yRLf0Ir25aFkThMc1jx5b8Ub-glyQ/exec"
    title="茅ヶ崎民泊 業務記録"
    allow="clipboard-write"
  ></iframe>
  <button id="install" class="install" type="button" hidden>アプリをインストール</button>
  <script>
    const installButton=document.getElementById('install');
    let installPrompt=null;
    window.addEventListener('beforeinstallprompt',event=>{
      event.preventDefault();
      installPrompt=event;
      installButton.hidden=false;
    });
    installButton.addEventListener('click',async()=>{
      if(!installPrompt)return;
      installButton.hidden=true;
      await installPrompt.prompt();
      installPrompt=null;
    });
    window.addEventListener('appinstalled',()=>{
      installPrompt=null;
      installButton.hidden=true;
    });
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
